name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # so build.cmd runs as is
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v5
        with:
          name: ThinkPadKbdLight
          path: ThinkPadKbdLight.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ThinkPadKbdLight.exe --title "$GITHUB_REF_NAME" --generate-notes
